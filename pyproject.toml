[project]
name = "jobpilot"
version = "0.1.0"
description = "Semi-automated LinkedIn job application copilot with learning capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Garo Vartabedian", email = "6820443+Vartabg@users.noreply.github.com" },
]
keywords = ["linkedin", "job-application", "automation", "ats", "resume", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

dependencies = [
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "typer>=0.16.0",  # <0.16 crashes on --help with click>=8.2 (make_metavar ctx arg)
    "pydantic>=2.0.0",
    "rapidfuzz>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "feedparser>=6.0.10",
    "qrcode>=7.4",
    "Pillow>=10.1.0",  # PNG dashboard and sized default-font fallback
    "langgraph>=1.0,<2",  # fit-check workflow (engine/adapters/fit_graph.py), loaded lazily
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",  # FastAPI/Starlette TestClient
    "pypdf>=6.0.0",  # product/importing.py PDF resume import (tests/product)
]

[project.urls]
Homepage = "https://github.com/Vartabg/jobpilot"
Source = "https://github.com/Vartabg/jobpilot"
Issues = "https://github.com/Vartabg/jobpilot/issues"

[project.scripts]
jobpilot = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build]
include = [
    "*.py",
    "core/*.py",
    "engine/**/*.py",
    "bridge/*.py",
    "gigs/**/*.py",
    "gigs/**/*.html",
    "ui/*.py",
    "learning/*.py",
    "scripts/*.sh",
]

[tool.pytest.ini_options]
# Let bare `pytest tests/` (the invocation documented in CONTRIBUTING.md)
# resolve rootless imports (`product`, `scripts`, `jobpilot`) exactly like
# `python3 -m pytest tests/` and CI's PYTHONPATH=$(dirname $PWD) in
# .github/workflows/checks.yml do. pytest >= 7.
pythonpath = ["."]
