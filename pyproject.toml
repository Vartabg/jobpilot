[project]
name = "jobpilot"
version = "0.1.0"
description = "Evidence-led job search and application preparation assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Garo Vartabedian", email = "6820443+Vartabg@users.noreply.github.com" },
]
keywords = ["job-search", "job-application", "evidence", "ats", "resume", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

dependencies = [
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "typer>=0.16.0",  # <0.16 crashes on --help with click>=8.2 (make_metavar ctx arg)
    "pydantic>=2.0.0",
    "rapidfuzz>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "feedparser>=6.0.10",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/Vartabg/jobpilot"
Source = "https://github.com/Vartabg/jobpilot"
Issues = "https://github.com/Vartabg/jobpilot/issues"

[project.scripts]
jobpilot = "jobpilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "jobpilot/__init__.py"
"cli.py" = "jobpilot/cli.py"
"cli_agent.py" = "jobpilot/cli_agent.py"
"core" = "jobpilot/core"
"gigs" = "jobpilot/gigs"
"learning" = "jobpilot/learning"
"scripts" = "jobpilot/scripts"
"ui" = "jobpilot/ui"

[tool.hatch.build.targets.sdist]
include = [
    "/__init__.py",
    "/cli.py",
    "/cli_agent.py",
    "/core/*.py",
    "/gigs/**/*.py",
    "/gigs/**/*.html",
    "/ui/*.py",
    "/ui/*.html",
    "/learning/*.py",
    "/scripts/*.py",
    "/scripts/*.sh",
    "/scripts/agents",
    "/scripts/iterm/*",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
