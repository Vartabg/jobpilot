target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
]
# These "confusables" are deliberate: en-dash minus signs appear in real-world
# salary-range postings the scrapers must parse, and the multiplication sign
# is display text.
allowed-confusables = ["–", "−", "×"]

[lint.per-file-ignores]
# cli.py: sys.path bootstrap must precede package imports (repo-local
# execution), and typer.Option() in argument defaults is Typer's canonical
# signature idiom.
"cli.py" = ["E402", "B008"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
