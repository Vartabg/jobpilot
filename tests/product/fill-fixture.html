<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobPilot fill fixture</title>
<style>label{display:block;margin:8px 0 2px;}input,select,textarea{display:block;margin:0 0 8px;}</style>
</head>
<body>
<h1>Job application (test fixture)</h1>
<form id="app-form">
<div><label for="first_name">First name</label><input id="first_name" name="first_name" type="text" autocomplete="section-applicant shipping given-name"></div>
<div><label for="last_name">Last name</label><input id="last_name" name="last_name" type="text" autocomplete="section-applicant family-name"></div>
<div><label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" autocomplete="name"></div>
<div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"></div>
<div><label for="email_prefilled">Email (on file)</label><input id="email_prefilled" name="email_prefilled" type="email" autocomplete="email" value="already@example.com"></div>
<div><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
<div><label for="city">City</label><input id="city" name="city" type="text" autocomplete="address-level2"></div>
<div><label for="region">State</label><input id="region" name="region" type="text" autocomplete="address-level1"></div>
<div><label for="country">Country</label><input id="country" name="country" type="text" autocomplete="country-name"></div>
<div><label for="postal_code">ZIP code</label><input id="postal_code" name="postal_code" type="text" autocomplete="shipping postal-code"></div>
<div><label for="linkedin">LinkedIn profile URL</label><input id="linkedin" name="linkedin" type="url" autocomplete="url"></div>
<div><label for="portfolio">Website</label><input id="portfolio" name="portfolio" type="url"></div>
<div><label for="github">GitHub</label><input id="github" name="github" type="url"></div>
<div><label for="headline">Current title</label><input id="headline" name="headline" type="text" autocomplete="organization-title"></div>
<input id="candidate_token" name="candidate_token" type="hidden" value="do-not-touch">
<fieldset id="refs"><legend>References</legend>
<div><label for="ref_email">Reference email</label><input id="ref_email" name="ref_email" type="email"></div>
<div><label for="emergency_name">Emergency contact name</label><input id="emergency_name" name="emergency_name" type="text"></div>
</fieldset>
<section aria-label="work history"><h2>Previous employer</h2>
<div><label for="prev_phone">Previous employer phone</label><input id="prev_phone" name="prev_phone" type="tel"></div>
<div><label for="school_name">School name</label><input id="school_name" name="school_name" type="text"></div>
</section>
<div><label for="citizenship_country">Country of citizenship</label><input id="citizenship_country" name="citizenship_country" type="text"></div>
<div><label for="linkedin_password">LinkedIn password</label><input id="linkedin_password" name="linkedin_password" type="password"></div>
<div><label for="years">Years of experience</label><input id="years" name="years" type="number"></div>
<div><label for="country_select">Country select</label><select id="country_select" name="country_select"><option value="">Select</option><option value="us">United States</option></select></div>
<div><span>Work authorization</span><label><input type="radio" name="auth" value="yes">Yes</label><label><input type="radio" name="auth" value="no">No</label></div>
<div><label><input id="agree" type="checkbox" name="agree">I agree to the terms</label></div>
<div><label for="cover">Cover letter</label><textarea id="cover" name="cover"></textarea></div>
<div><label for="resume">Resume</label><input id="resume" name="resume" type="file"></div>
<button type="submit" id="submit">Submit</button>
</form>
<script>
window.__inputEvents=0;window.__changeEvents=0;window.__submitCount=0;
document.querySelectorAll("input").forEach(function(el){
el.addEventListener("input",function(){window.__inputEvents++;});
el.addEventListener("change",function(){window.__changeEvents++;});
});
document.getElementById("app-form").addEventListener("submit",function(e){e.preventDefault();window.__submitCount++;});
</script>
</body>
</html>
