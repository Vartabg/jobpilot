<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GigPilot" />
<meta name="theme-color" content="#0d1117" />
<meta name="referrer" content="no-referrer" />
<script>
function consumeRemoteToken() {
  const url = new URL(window.location.href);
  const queryToken = url.searchParams.get("token") || "";
  if (url.searchParams.has("token")) {
    try {
      if (queryToken) sessionStorage.setItem("jobpilotRemoteToken", queryToken);
    } catch (_) {}
    url.searchParams.delete("token");
    history.replaceState(history.state, "", url.pathname + url.search + url.hash);
  }
  if (queryToken) return queryToken;
  try {
    return sessionStorage.getItem("jobpilotRemoteToken") || "";
  } catch (_) {
    return "";
  }
}
const remoteToken = consumeRemoteToken();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161b22'/%3E%3Ctext x='32' y='44' font-size='38' text-anchor='middle' fill='%2358a6ff'%3EG%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230d1117'/%3E%3Ctext x='32' y='44' font-size='38' text-anchor='middle' fill='%2358a6ff'%3EG%3C/text%3E%3C/svg%3E" />
<title>GigPilot Swipe</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e;
          --green:#3fb950; --red:#f85149; --blue:#58a6ff; --yellow:#d29922; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  .skip-link { position:fixed; left:0; top:0; z-index:100; padding:12px 16px; background:#fff; color:#000;
    font-weight:700; transform:translateY(-120%); transition:transform .12s ease; }
  .skip-link:focus { transform:translateY(0); }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:18px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overscroll-behavior:none; }
  #app { max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 14px); }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 2px 8px; gap:10px; }
  header h1 { font-size:18px; font-weight:600; margin:0; }
  main { flex:1; min-height:0; display:flex; flex-direction:column; }
  #count { color:var(--dim); font-size:14px; white-space:nowrap; }
  #criteria { display:flex; flex-wrap:wrap; gap:6px; padding:0 2px 10px; }
  #criteria:empty { display:none; }
  .screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:24px; }
  button { font:inherit; border:none; border-radius:14px; padding:18px 22px; font-weight:600; cursor:pointer; }
  .primary { background:var(--blue); color:#04122b; font-size:19px; }
  .ghost { background:transparent; color:var(--dim); border:1px solid var(--line); }
  .copybtn { background:#1f2630; color:var(--blue); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; min-height:40px; }
  .copybtn:active { background:#2a3340; }
  .spinner { width:38px; height:38px; border:4px solid var(--line); border-top-color:var(--blue); border-radius:50%; animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #deck { flex:1; position:relative; min-height:0; }
  .card { position:absolute; inset:0; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:18px; display:flex; flex-direction:column; gap:10px; overflow-y:auto;
    transition:transform .25s ease, opacity .25s ease; will-change:transform; -webkit-overflow-scrolling:touch; }
  .scorerow { display:flex; align-items:center; gap:10px; }
  .score { background:var(--green); color:#04140a; font-weight:700; border-radius:10px; padding:4px 10px; font-size:15px; }
  .score.mid { background:var(--yellow); color:#241a02; }
  .role { font-size:23px; font-weight:600; line-height:1.25; margin:0; }
  .company { color:var(--blue); font-size:17px; }
  .meta { display:flex; flex-wrap:wrap; gap:8px; color:var(--dim); font-size:15px; }
  .pill { background:#1f2630; border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:13px; }
  .pill.gate { color:var(--dim); font-size:12px; }
  .offer { font-size:15px; color:var(--txt); }
  .offer b { color:var(--yellow); font-weight:600; }
  .why { display:flex; flex-wrap:wrap; gap:6px; }
  .why .pill { color:var(--dim); }
  details { border-top:1px solid var(--line); padding-top:8px; }
  summary { color:var(--blue); font-size:16px; cursor:pointer; padding:10px 0; min-height:44px; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  pre { white-space:pre-wrap; word-wrap:break-word; font:13px/1.5 ui-monospace,Menlo,monospace;
    background:#0b0f14; border:1px solid var(--line); border-radius:10px; padding:12px; margin:10px 0 0; color:var(--txt); }
  .resume { font-size:15px; color:var(--dim); background:#0b0f14; border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; }
  .resume b { color:var(--txt); font-size:16px; }
  .row { display:flex; gap:8px; align-items:flex-start; justify-content:space-between; padding:8px 0;
    border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .row .lab { color:var(--dim); font-size:12px; display:block; }
  .row .val { font-size:14px; color:var(--txt); word-break:break-word; }
  .row .left { flex:1; min-width:0; padding-right:8px; }
  .anchor { color:var(--yellow); font-size:13px; }
  .actions { display:flex; gap:14px; padding-top:12px; flex-shrink:0; }
  .actions button { flex:1; font-size:21px; padding:20px 18px; min-height:64px; }
  .pass { background:#2a1416; color:var(--red); border:1px solid #5b2326; }
  .apply { background:var(--green); color:#04140a; }
  .hint { color:var(--dim); font-size:13px; text-align:center; padding:6px 0 0; }
  .srcrow { display:flex; gap:16px; align-items:center; font-size:14px; color:var(--dim); padding:4px 0; flex-wrap:wrap; }
  .srcrow a { color:var(--blue); text-decoration:none; padding:8px 0; min-height:40px; display:inline-flex; align-items:center; }
  #snack { position:fixed; left:50%; bottom:88px; transform:translateX(-50%); max-width:92%;
    background:#1f2630; border:1px solid var(--line); color:var(--txt); padding:10px 14px;
    border-radius:12px; font-size:14px; display:flex; gap:14px; align-items:center; z-index:50; box-shadow:0 6px 20px rgba(0,0,0,.4); }
  #snack button { padding:6px 14px; font-size:14px; border:1px solid var(--blue); color:var(--blue);
    background:transparent; border-radius:8px; font-weight:600; }
  .stamp { position:absolute; top:24px; font-size:30px; font-weight:800; padding:4px 14px; border-radius:10px; border:3px solid; opacity:0; transition:opacity .1s; z-index:2; }
  .stamp.apply { right:24px; color:var(--green); border-color:var(--green); transform:rotate(12deg); }
  .stamp.pass { left:24px; color:var(--red); border-color:var(--red); transform:rotate(-12deg); }
  .start-notes { color:var(--dim); font-size:13px; text-align:left; max-width:100%; }
  .start-notes li { margin:4px 0; }
  :focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:1ms !important; animation-iteration-count:1 !important;
      scroll-behavior:auto !important; transition-duration:1ms !important; }
    .spinner { border-top-color:var(--txt); }
  }
  @media (forced-colors: active) {
    button, .card, .resume, pre { border:1px solid ButtonText; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to job cards</a>
<div id="app">
  <header><h1>GigPilot</h1><span id="count" role="status" aria-live="polite" aria-atomic="true"></span></header>
  <div id="criteria"></div>
  <main id="main" tabindex="-1">
  <div id="start" class="screen">
    <div style="font-size:42px" aria-hidden="true">🧭</div>
    <div style="color:var(--dim)">Phone-first. Tap Get jobs when ready — no 8am wait.</div>
    <div id="start-criteria" class="meta" style="justify-content:center"></div>
    <ul id="start-notes" class="start-notes"></ul>
    <div id="start-resume" class="resume" hidden></div>
    <button type="button" class="primary" onclick="load(0)">Get jobs</button>
  </div>
  <div id="loading" class="screen" role="status" aria-live="polite" aria-atomic="true" hidden><div class="spinner" aria-hidden="true"></div><div style="color:var(--dim)">Scanning sources…</div></div>
  <div id="deck" hidden></div>
  <div id="actions" class="actions" hidden>
    <button type="button" class="pass" onclick="decide('pass')">✕ Pass</button>
    <button type="button" class="apply" onclick="decide('apply')">★ Apply</button>
  </div>
  <div id="acthint" class="hint" hidden>Apply opens email or ATS. Expand Crib to paste answers.</div>
  <div id="error" class="screen" role="alert" aria-live="assertive" hidden>
    <div style="font-size:42px" aria-hidden="true">⚠️</div>
    <div id="errmsg" style="color:var(--dim)">Couldn't reach the server.</div>
    <button type="button" class="primary" onclick="load(1)">Try again</button>
  </div>
  <div id="done" class="screen" role="status" aria-live="polite" aria-atomic="true" hidden>
    <div style="font-size:42px" aria-hidden="true">✓</div>
    <div id="donemsg" style="color:var(--dim)">All caught up.</div>
    <button type="button" class="ghost" onclick="load(1)">Rescan</button>
  </div>
  </main>
  <div id="snack" role="status" aria-live="polite" aria-atomic="true" hidden></div>
</div>
<script>
let cards = [], i = 0, busy = false, last = null, snackTimer = null, meta = null;
const $ = id => document.getElementById(id);
const show = (id, on) => $(id).hidden = !on;
const safeUrl = u => /^https?:\/\//i.test(u || "");
const ageLabel = d => d == null ? "" : d <= 0 ? "today" : d === 1 ? "1d ago" : d + "d ago";

function remoteFetch(path, opts = {}) {
  const headers = new Headers(opts.headers || {});
  if (remoteToken) headers.set("X-JobPilot-Token", remoteToken);
  return fetch(path, { ...opts, headers });
}

function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

function setCriteria(m) {
  meta = m || null;
  const pills = (m && m.criteria_pills) || [];
  const html = pills.map(p => `<span class="pill gate">${esc(p)}</span>`).join("");
  $("criteria").innerHTML = html;
  $("start-criteria").innerHTML = html;
  const notes = (m && m.notes) || [];
  $("start-notes").innerHTML = notes.map(n => `<li>${esc(n)}</li>`).join("");
  if (m && m.default_resume) {
    $("start-resume").hidden = false;
    $("start-resume").innerHTML = `Default resume: <b>${esc(m.default_resume)}</b>`;
  } else {
    $("start-resume").hidden = true;
  }
}

async function copyText(text, label) {
  const t = text == null ? "" : String(text);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(t);
    } else {
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.left = "-9999px";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    toast(`Copied${label ? ": " + label : ""}`, null);
  } catch (e) {
    toast("Copy failed — long-press the text", null);
  }
}

function copyRow(label, value) {
  return `<div class="row">
    <div class="left"><span class="lab">${esc(label)}</span><span class="val">${esc(value)}</span></div>
    <button type="button" class="copybtn" data-copy="${esc(value)}" data-label="${esc(label)}">Copy</button>
  </div>`;
}

function wireCopyButtons(root) {
  root.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      copyText(btn.getAttribute("data-copy"), btn.getAttribute("data-label"));
    });
  });
}

async function load(refresh) {
  ["start","deck","actions","acthint","done","error"].forEach(x => show(x, false));
  hideSnack();
  show("loading", true);
  let data = null, ok = false;
  try {
    const r = refresh || !cards.length
      ? await remoteFetch("/api/queue/refresh", { method:"POST" })
      : await remoteFetch("/api/queue");
    ok = r.ok;
    data = await r.json();
  } catch (e) { ok = false; }
  show("loading", false);
  if (!ok || !data || data.error) {
    $("errmsg").textContent = (data && data.error) || "Couldn't reach the server. Is the Mac on? Try again.";
    show("error", true);
    return;
  }
  if (data.meta) setCriteria(data.meta);
  cards = data.cards || []; i = 0;
  cards.length ? render() : finish("No fresh jobs right now.");
}

function finish(msg) {
  ["deck","actions","acthint"].forEach(x => show(x, false));
  $("count").textContent = "";
  $("donemsg").textContent = msg || "All caught up.";
  show("done", true);
}

function render() {
  if (i >= cards.length) return finish(`Done — ${cards.length} reviewed.`);
  const c = cards[i];
  $("count").textContent = `${i + 1} / ${cards.length}`;
  const why = (c.why || []).map(w => `<span class="pill">${esc(w)}</span>`).join("");
  const tags = (c.tags || []).map(t => `<span class="pill">${esc(t)}</span>`).join("");
  const resume = c.resume
    ? `<div class="resume">Attach resume: <b>${esc(c.resume)}</b>
         <button type="button" class="copybtn" style="margin-left:8px" data-copy="${esc(c.resume)}" data-label="resume">Copy name</button></div>`
    : `<div class="resume">No resume mapped for this offer — set data/gigs preferences.</div>`;
  const age = ageLabel(c.posted_age_days);
  const link = safeUrl(c.source_url) ? `<a href="${esc(c.source_url)}" target="_blank" rel="noopener noreferrer">View posting ↗</a>` : "";
  const srcrow = (age || link || c.source)
    ? `<div class="srcrow">${age ? `<span>Posted ${esc(age)}</span>` : ""}${link}<span style="margin-left:auto">${esc(c.source || "")}</span></div>`
    : "";
  const crib = c.crib || {};
  const id = crib.identity || {};
  const ats = (crib.ats_answers || []).map(a => copyRow(a.label, a.value)).join("");
  const idRows = [
    ["Name", [id.first_name, id.last_name].filter(Boolean).join(" ")],
    ["Email", id.email],
    ["Phone", id.phone],
    ["LinkedIn", id.linkedin],
    ["GitHub", id.github],
    ["Portfolio", id.portfolio],
  ].filter(([,v]) => v).map(([l,v]) => copyRow(l, v)).join("");

  const salaryResponse = crib.salary_paste
    ? copyRow("Desired salary (paste)", crib.salary_paste)
    : `<div class="row"><div class="left"><span class="lab">Desired salary</span><span class="val">Not configured — answer manually</span></div></div>`;
  const salaryBlock = `
    ${salaryResponse}
    <div class="row"><div class="left"><span class="lab">Your anchor (don't paste)</span>
      <span class="val anchor">${esc(crib.salary_anchor || "")}</span></div></div>
    ${copyRow("Relocate", crib.relocate || "")}
    ${crib.in_office ? copyRow("In-office", crib.in_office) : ""}`;

  $("deck").innerHTML = `
    <article class="card" id="card" tabindex="-1" aria-labelledby="job-card-title">
      <div class="stamp apply" id="st-apply">APPLY</div>
      <div class="stamp pass" id="st-pass">PASS</div>
      <div class="scorerow"><span class="score ${c.score < 90 ? "mid" : ""}">${esc(c.score)}</span>
        <div class="meta"><span class="pill">${esc(c.pay)}</span><span class="pill">${esc(c.location)}</span></div></div>
      <h2 class="role" id="job-card-title">${esc(c.role)}</h2>
      <div class="company">${esc(c.company)}</div>
      <div class="offer">${c.draft_mode === "contract" ? "Contract pitch" : "FTE interest"}: <b>${esc(c.offer)}</b></div>
      <div class="why">${why || tags}</div>
      ${resume}
      ${srcrow}
      <details open><summary>Crib — salary &amp; relocate</summary>${salaryBlock}</details>
      <details><summary>Crib — identity</summary>${idRows || "<div class='row'><span class='val'>No identity set</span></div>"}</details>
      <details><summary>Crib — ATS answers</summary>${ats}</details>
      <details><summary>Preview the email</summary>
        <button type="button" class="copybtn" id="copy-email">Copy full email</button>
        <pre>${esc(c.subject)}\n\n${esc(c.draft)}</pre></details>
    </article>`;
  show("deck", true); show("actions", true); show("acthint", true);
  const cardEl = $("card");
  wireCopyButtons(cardEl);
  const emailBtn = $("copy-email");
  if (emailBtn) {
    emailBtn.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      copyText((c.subject || "") + "\n\n" + (c.draft || ""), "email");
    };
  }
  wireSwipe(cardEl);
  requestAnimationFrame(() => cardEl.focus());
  $("acthint").textContent = c.is_mailto
    ? "Apply opens a prepped email — attach " + (c.resume || "resume") + " and send."
    : "Apply opens the form — use Crib Copy buttons for paste fields.";
}

async function decide(action, viaFling) {
  if (busy) return;
  const c = cards[i];
  if (!c) return;
  busy = true;
  if (action === "apply") {
    if (c.is_mailto) window.location.href = c.apply_target;
    else if (safeUrl(c.apply_target)) window.open(c.apply_target, "_blank", "noopener,noreferrer");
  }
  let ok = false;
  try {
    const r = await remoteFetch("/api/decision", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ id: c.id, action }) });
    ok = r.ok;
  } catch (e) { ok = false; }
  if (!ok) {
    busy = false;
    const el = $("card"); if (el) { el.style.transform = ""; el.style.opacity = 1; }
    toast("Couldn't save — try again", null);
    return;
  }
  last = c;
  if (!viaFling) flingNow(action);
  const motionDelay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 220;
  setTimeout(() => {
    i++; busy = false; render();
    toast(action === "apply" ? "Opened — confirm sent in pipeline after sending" : "Passed", undo);
  }, motionDelay);
}

async function undo() {
  if (!last) return;
  const c = last; last = null; hideSnack();
  try { await remoteFetch("/api/undo", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ id: c.id }) }); } catch (e) {}
  cards.splice(i, 0, c);
  render();
}

function toast(msg, onUndo) {
  $("snack").innerHTML = `<span>${esc(msg)}</span>` + (onUndo ? `<button id="undo-btn">Undo</button>` : "");
  show("snack", true);
  if (onUndo) $("undo-btn").onclick = onUndo;
  clearTimeout(snackTimer); snackTimer = setTimeout(hideSnack, 4000);
}
function hideSnack() { show("snack", false); }
function flingNow(action) { const el = $("card"); if (el) flingEl(el, action === "apply" ? 1 : -1); }

function wireSwipe(el) {
  let x0 = null, dx = 0;
  const T = 90;
  el.addEventListener("touchstart", e => { if (!busy) x0 = e.touches[0].clientX; }, { passive:true });
  el.addEventListener("touchmove", e => {
    if (x0 === null || busy) return;
    dx = e.touches[0].clientX - x0;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
    $("st-apply").style.opacity = dx > 30 ? Math.min(1, dx / T) : 0;
    $("st-pass").style.opacity = dx < -30 ? Math.min(1, -dx / T) : 0;
  }, { passive:true });
  el.addEventListener("touchend", () => {
    if (busy) { x0 = null; dx = 0; return; }
    if (dx > T) { flingEl(el, 1); decide("apply", true); }
    else if (dx < -T) { flingEl(el, -1); decide("pass", true); }
    else { el.style.transform = ""; $("st-apply").style.opacity = 0; $("st-pass").style.opacity = 0; }
    x0 = null; dx = 0;
  });
}
function flingEl(el, dir) {
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.style.transform = `translateX(${dir * 600}px) rotate(${dir * 30}deg)`;
  }
  el.style.opacity = 0;
}

// Prefetch criteria for the start screen without a full scan.
(async () => {
  try {
    const r = await remoteFetch("/api/meta");
    if (r.ok) setCriteria(await r.json());
  } catch (e) {}
})();
</script>
</body>
</html>
