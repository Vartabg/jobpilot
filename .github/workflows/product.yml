name: Product checks
on: [push, pull_request]
jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r product-requirements.txt pytest httpx
      - run: python -m pytest tests/product -q
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Product browser and accessibility checks
        run: |
          python tests/product/serve_fixture.py --port 3182 --data-dir "$RUNNER_TEMP/jobpilot-product" &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3182/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:product
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-browser-evidence
          path: /tmp/jobpilot-product-checks
  mac-preview:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r product-requirements.txt pyinstaller==6.22.2
      - run: python scripts/build_product.py
      - run: python scripts/package_product.py
      - uses: actions/upload-artifact@v4
        with:
          name: JobPilot-macOS-preview
          path: dist/product/*.zip
